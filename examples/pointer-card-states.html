<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Pointer card fixture</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 32px; }
      .claim-card { border: 1px solid #d9d9d9; border-radius: 8px; cursor: pointer; margin: 12px 0; padding: 16px; }
      #detail[hidden] { display: none; }
    </style>
  </head>
  <body>
    <main id="list">
      <h1>认领审核</h1>
      <div class="claim-card" data-name="客户 A">客户 A</div>
      <div class="claim-card" data-name="客户 B">客户 B</div>
    </main>
    <section id="detail" hidden>
      <h1>认领审核详情</h1>
      <p id="detail-content"></p>
    </section>
    <script>
      document.querySelectorAll('.claim-card').forEach((card) => {
        card.addEventListener('click', () => {
          document.querySelector('#list').hidden = true;
          document.querySelector('#detail').hidden = false;
          document.querySelector('#detail-content').textContent = `详情：${card.dataset.name}`;
        });
      });
    </script>
  </body>
</html>
