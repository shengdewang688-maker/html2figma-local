<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Mermaid flowchart fixture</title>
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  </head>
  <body>
    <h1>开户认领流程</h1>
    <pre class="mermaid">
flowchart TD
  Start[发起认领] --> Check{AI 校验}
  Check -->|通过| Done[已完成]
  Check -->|修改| Start
    </pre>
    <script>
      mermaid.initialize({ startOnLoad: true, flowchart: { htmlLabels: true } });
    </script>
  </body>
</html>
